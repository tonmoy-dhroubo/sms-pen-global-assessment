name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `postinstall` runs `prisma generate`, so the typed client exists before type-check and build.
      - run: npm ci
      - run: npm run db:validate
        env:
          # `prisma validate` only needs a well-formed URL; nothing connects to it.
          DIRECT_URL: postgresql://sms:sms@localhost:5432/sms
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          # CI has no .env. `lib/env` validates these when a module imports `lib/db`; the build never connects
          # to anything, so placeholders are enough.
          DATABASE_URL: postgresql://sms:sms@localhost:5432/sms
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: submissions
          S3_ACCESS_KEY_ID: ci-placeholder
          S3_SECRET_ACCESS_KEY: ci-placeholder
          SESSION_SECRET: ci-placeholder-session-secret-at-least-32-chars

  unit-tests:
    name: Unit tests and coverage (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Domain rules must not depend on the machine's time zone (M04): run them in two very different zones.
        tz: [UTC, America/New_York]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Fails if coverage of lib/services/rules drops below 95% (lines and branches); see vitest.config.mts.
      - run: npm run test:coverage

  migrations:
    name: Apply migrations and check constraints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms
          POSTGRES_DB: sms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms -d sms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIRECT_URL: postgresql://sms:sms@localhost:5432/sms_test
      DATABASE_URL: postgresql://sms:sms@localhost:5432/sms_test
      TEST_DATABASE_URL: postgresql://sms:sms@localhost:5432/sms_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Apply migrations to an empty database
        run: npm run db:deploy
      - name: Second run reports nothing to apply
        run: npm run db:deploy
      - name: Migrations match the schema (no drift)
        run: npm run db:drift

  integration-tests:
    name: Integration tests (Postgres service container + MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms
          POSTGRES_DB: sms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms -d sms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The harness (tests/support) refuses any database whose name does not end in "_test", drops and
      # re-creates its schema, then runs `prisma migrate deploy`. It also creates and empties the
      # `submissions-test` bucket on MinIO (started below) and points the app at it, whatever S3_BUCKET says.
      TEST_DATABASE_URL: postgresql://sms:sms@localhost:5432/sms_test
      DATABASE_URL: postgresql://sms:sms@localhost:5432/sms_test
      DIRECT_URL: postgresql://sms:sms@localhost:5432/sms_test
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: submissions-test
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4

      # MinIO is a step rather than a service container: the pgsty/minio image has no usable default command
      # (it needs `server /data`) and service containers cannot pass one. The image tag is read from
      # docker-compose.yml so CI and local development always run the same version (D-027).
      - name: Start MinIO
        run: |
          image="$(grep -oE 'pgsty/minio:[^[:space:]]+' docker-compose.yml | head -n 1)"
          echo "Starting $image"
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            "$image" server /data
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/ready; then echo "MinIO is ready"; exit 0; fi
            sleep 1
          done
          docker logs minio
          echo "MinIO did not become ready" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Database constraints (tests/integration/db), the API (tests/integration/api) and storage
      # (tests/integration/storage) share one harness.
      - run: npm run test:integration

  seed:
    name: Seed data and reset (Postgres service container + MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms
          POSTGRES_DB: sms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms -d sms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The same variables a developer's .env holds. `db:reset` refuses any database or storage endpoint that is not
      # local, which both of these are. The `submissions` bucket does not exist yet: the seed creates it.
      DATABASE_URL: postgresql://sms:sms@localhost:5432/sms
      DIRECT_URL: postgresql://sms:sms@localhost:5432/sms
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: submissions
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      SESSION_SECRET: ci-placeholder-session-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4

      # Same MinIO step as the integration job (the image tag comes from docker-compose.yml, D-027).
      - name: Start MinIO
        run: |
          image="$(grep -oE 'pgsty/minio:[^[:space:]]+' docker-compose.yml | head -n 1)"
          echo "Starting $image"
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            "$image" server /data
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/ready; then echo "MinIO is ready"; exit 0; fi
            sleep 1
          done
          docker logs minio
          echo "MinIO did not become ready" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Drops the schema, applies the migrations, empties the bucket, seeds, and runs the seed's self-check against the
      # real rule functions. A mismatch with db/seed-plan.md fails the build, so the seed cannot rot.
      - name: Reset and seed (includes the self-check)
        shell: bash
        run: npm run db:reset | tee reset-1.log

      - name: The seed refuses a database that already has data
        shell: bash
        run: |
          if npm run db:seed; then
            echo "db:seed should have refused to run on a populated database" >&2
            exit 1
          fi

      - name: Reset again; the content is identical
        shell: bash
        run: |
          npm run db:reset | tee reset-2.log
          first="$(grep '^Seed fingerprint' reset-1.log)"
          second="$(grep '^Seed fingerprint' reset-2.log)"
          echo "first:  $first"
          echo "second: $second"
          test -n "$first" && test "$first" = "$second"

  integration-tests-filesystem:
    name: Integration tests, filesystem storage, no MinIO (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The "run without Docker" path (D-045): the oldest PostgreSQL verified (14) and the one the Docker setup uses.
        postgres: ["14-alpine", "18.6-alpine"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms
          POSTGRES_DB: sms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms -d sms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Same harness as the job above, but STORAGE_DRIVER=filesystem: files go to ./storage-test, no S3_* variables are
      # set, and there is no MinIO at all.
      STORAGE_DRIVER: filesystem
      TEST_DATABASE_URL: postgresql://sms:sms@localhost:5432/sms_test
      DATABASE_URL: postgresql://sms:sms@localhost:5432/sms_test
      DIRECT_URL: postgresql://sms:sms@localhost:5432/sms_test
      SESSION_SECRET: ci-placeholder-session-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run test:integration
      # The seed writes its demo files through the same adapter; db:reset runs the seed's self-check.
      - name: Reset and seed on the filesystem driver (includes the self-check)
        run: npm run db:reset
