name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `postinstall` runs `prisma generate`, so the typed client exists before type-check and build.
      - run: npm ci
      - run: npm run db:validate
        env:
          # `prisma validate` only needs a well-formed URL; nothing connects to it.
          DIRECT_URL: postgresql://sms:sms@localhost:5432/sms
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          # CI has no .env. `lib/env` validates these when a module imports `lib/db`; the build never connects
          # to anything, so placeholders are enough.
          DATABASE_URL: postgresql://sms:sms@localhost:5432/sms
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: submissions
          S3_ACCESS_KEY_ID: ci-placeholder
          S3_SECRET_ACCESS_KEY: ci-placeholder
          SESSION_SECRET: ci-placeholder-session-secret-at-least-32-chars

  unit-tests:
    name: Unit tests and coverage (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Domain rules must not depend on the machine's time zone (M04): run them in two very different zones.
        tz: [UTC, America/New_York]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Fails if coverage of lib/services/rules drops below 95% (lines and branches); see vitest.config.mts.
      - run: npm run test:coverage

  migrations:
    name: Apply migrations and check constraints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms
          POSTGRES_DB: sms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms -d sms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIRECT_URL: postgresql://sms:sms@localhost:5432/sms_test
      DATABASE_URL: postgresql://sms:sms@localhost:5432/sms_test
      TEST_DATABASE_URL: postgresql://sms:sms@localhost:5432/sms_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Apply migrations to an empty database
        run: npm run db:deploy
      - name: Second run reports nothing to apply
        run: npm run db:deploy
      - name: Migrations match the schema (no drift)
        run: npm run db:drift

  integration-tests:
    name: Integration tests (Postgres service container)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms
          POSTGRES_DB: sms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms -d sms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The harness (tests/support) refuses any database whose name does not end in "_test", drops and
      # re-creates its schema, then runs `prisma migrate deploy`. MinIO joins this job in M06.
      TEST_DATABASE_URL: postgresql://sms:sms@localhost:5432/sms_test
      DATABASE_URL: postgresql://sms:sms@localhost:5432/sms_test
      DIRECT_URL: postgresql://sms:sms@localhost:5432/sms_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Database constraints (tests/integration/db) and the API (tests/integration/api) share one harness.
      - run: npm run test:integration
